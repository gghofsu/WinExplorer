name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Also compile the Inno Setup installer'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($error in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($error.Extent.StartLineNumber)::$($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Restore
        run: dotnet restore WinExplorer.sln

      - name: Build
        run: dotnet build WinExplorer.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          dotnet test WinExplorer.sln -c Release --no-build `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=results.trx" `
            --results-directory TestResults
          $code = $LASTEXITCODE

          # Surface failing tests as check annotations: the runner log is not always
          # downloadable from the API, annotations always are.
          $trx = 'TestResults/results.trx'
          if (Test-Path $trx) {
            [xml]$results = Get-Content $trx
            foreach ($result in $results.TestRun.Results.UnitTestResult) {
              if ($result.outcome -eq 'Failed') {
                $message = $result.Output.ErrorInfo.Message
                if (-not $message) { $message = $result.Output.ErrorInfo.'#text' }
                $message = ($message -replace '\r?\n', ' ').Trim()
                Write-Host "::error title=$($result.testName)::$message"
              }
            }
          }

          exit $code

      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/WinExplorer/WinExplorer.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -o publish/framework-dependent

      - name: Publish (self-contained)
        run: >
          dotnet publish src/WinExplorer/WinExplorer.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content src/WinExplorer/WinExplorer.csproj |
            Select-String -Pattern '<Version>(.*)</Version>').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # Include the double-click installer/uninstaller in both zips.
          foreach ($dir in @('publish/framework-dependent', 'publish/self-contained')) {
            Copy-Item 'Install.cmd' $dir -Force
            Copy-Item 'Uninstall.cmd' $dir -Force
            New-Item -ItemType Directory -Force -Path "$dir/scripts" | Out-Null
            Copy-Item 'scripts/install-app.ps1' "$dir/scripts" -Force
            Copy-Item 'scripts/uninstall-app.ps1' "$dir/scripts" -Force
          }

          foreach ($dir in @('publish/framework-dependent', 'publish/self-contained')) {
            foreach ($file in @('Install.cmd', 'Uninstall.cmd', 'scripts/install-app.ps1', 'scripts/uninstall-app.ps1')) {
              if (-not (Test-Path (Join-Path $dir $file))) { throw "$file is missing from $dir" }
            }
          }

          Compress-Archive -Path 'publish/framework-dependent/*' -DestinationPath "artifacts/WinExplorer-$version-win-x64.zip"
          Compress-Archive -Path 'publish/self-contained/*' -DestinationPath "artifacts/WinExplorer-$version-win-x64-selfcontained.zip"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "artifacts/WinExplorer-$version-win-x64.zip"))
          try {
            $names = $zip.Entries | ForEach-Object FullName
            foreach ($file in @('Install.cmd', 'Uninstall.cmd', 'scripts/install-app.ps1', 'scripts/uninstall-app.ps1')) {
              if ($names -notcontains $file) { throw "$file is missing from the release zip" }
            }
          }
          finally {
            $zip.Dispose()
          }

      # Build the setup wizard on every run, so a broken .iss script (or a broken
      # uninstaller it embeds) shows up in the pull request instead of at release time.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content src/WinExplorer/WinExplorer.csproj |
            Select-String -Pattern '<Version>(.*)</Version>').Matches[0].Groups[1].Value
          try {
            ./scripts/make-installer.ps1 -OutputDirectory publish -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          catch {
            # Mirror the failure into a check annotation; the raw runner log is not always
            # downloadable through the API.
            Write-Host "::error title=Inno Setup::$($_.Exception.Message -replace '\r?\n', ' ')"
            throw
          }
          Copy-Item "installer/Output/WinExplorer-$version-setup.exe" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinExplorer
          path: |
            artifacts/*.zip
            artifacts/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.exe
